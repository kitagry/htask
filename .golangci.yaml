version: "2"

linters:
  enable:
    - errorlint
    - gocritic
    - misspell
    - usetesting
  settings:
    errcheck:
      # Commands write to stdout/stderr; a failed write there has nowhere to be reported.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln

formatters:
  enable:
    - gofmt
